$schema: "https://json-schema.org/draft/2020-12/schema"
description: snpArcher configuration schema
type: object
additionalProperties: false

properties:
  samples:
    type: string
    description: Path to samples CSV file
    default: "config/samples.csv"

  sample_metadata:
    type: string
    description: >
      Optional path to a sample metadata CSV file. Must contain a sample_id
      column that matches entries in the samples CSV. Additional columns
      (exclude, outgroup, lat, long, etc.) are used by modules.

  reads:
    type: object
    additionalProperties: false
    default: {}
    properties:
      mark_duplicates:
        type: boolean
        default: true

  mapping:
    type: object
    additionalProperties: false
    default: {}
    properties:
      pipeline:
        type: string
        enum: ["default", "sentieon", "repadapt"]
        default: "default"
        description: >
          How reads become each sample's final BAM. "default" is fastp, bwa mem
          and sambamba duplicate marking. "sentieon" is Sentieon's mapping and
          Dedup, and is used automatically with variant_calling.tool: sentieon
          (the only caller it supports). "repadapt" reproduces RepAdapt's
          processing with its pinned tools: fastp 0.20.1, bwa 0.7.17, a MAPQ >= 10
          filter, Picard duplicate removal per sample and GATK3 indel
          realignment; it works with every caller except sentieon. Samples
          supplied as BAMs are used as they are.
      repadapt:
        type: object
        additionalProperties: false
        default: {}
        properties:
          indel_realignment:
            oneOf:
              - type: boolean
              - type: string
                enum: ["auto"]
            default: "auto"
            description: >
              GATK3 indel realignment in the repadapt pipeline. "auto" realigns
              unless long_contig_mode is on (GATK3 needs BAI indexes, which
              can't index contigs longer than 2^29), and then skips it with a
              warning; true errors in long-contig mode; false always skips it.

  reference:
    type: object
    additionalProperties: false
    properties:
      name:
        type: string
        description: Reference genome name (used for output filenames)
      source:
        type: string
        description: Path, URL, or NCBI accession for reference genome
    required:
      - name
      - source

  variant_calling:
    type: object
    additionalProperties: false
    default: {}
    properties:
      expected_coverage:
        type: string
        enum: ["low", "high"]
        default: "low"
      tool:
        type: string
        enum: ["gatk", "sentieon", "bcftools", "deepvariant", "parabricks", "repadapt"]
        default: "gatk"
      long_contig_mode:
        oneOf:
          - type: boolean
          - type: string
            enum: ["auto"]
        default: "auto"
        description: >
          Use CSI-capable and GLnexus-based paths for references with contigs
          longer than the TBI coordinate limit. "auto" inspects an existing
          reference .fai when one is available while building the DAG.
      generate_filtered_vcf:
        type: boolean
        default: true
        description: >
          Produce results/vcfs/filtered.vcf.gz (raw calls annotated with a
          FILTER column) as a default output: the GATK hard filters for
          GATK-family callers (gatk/sentieon/parabricks), reproducing the v1
          raw + filtered output set, or RepAdapt's AllHomAlt (AC=AN) and LowMQ
          (MQ < 30) soft filters for repadapt. It is ignored with a warning for
          bcftools/deepvariant. When false, filtering is skipped entirely and
          the raw VCF becomes the final call set consumed by the
          postprocess/qc modules and the `call_variants` target.
      ploidy:
        type: integer
        minimum: 1
        default: 2
      gatk:
        type: object
        additionalProperties: false
        default: {}
        properties:
          het_prior:
            type: number
            minimum: 0
            maximum: 1
            default: 0.005
          concat_batch_size:
            type: integer
            minimum: 2
            default: 250
          concat_max_rounds:
            type: integer
            minimum: 1
            default: 20
      sentieon:
        type: object
        additionalProperties: false
        default: {}
        properties:
          license:
            type: string
            default: ""
      bcftools:
        type: object
        additionalProperties: false
        default: {}
        description: >
          mpileup settings for tool: bcftools. They have no effect with tool:
          repadapt, which uses RepAdapt's fixed settings.
        properties:
          min_mapq:
            type: integer
            minimum: 0
            default: 20
          min_baseq:
            type: integer
            minimum: 0
            default: 20
          max_depth:
            type: integer
            minimum: 1
            default: 250
      deepvariant:
        type: object
        additionalProperties: false
        default: {}
        properties:
          model_type:
            type: string
            enum: ["WGS", "WES", "PACBIO", "ONT_R104", "HYBRID_PACBIO_ILLUMINA"]
            default: "WGS"
          num_shards:
            type: integer
            minimum: 1
            default: 8
      parabricks:
        type: object
        additionalProperties: false
        default: {}
        properties:
          container_image:
            type: string
            default: ""
          num_gpus:
            type: integer
            minimum: 1
            default: 1
          num_cpu_threads:
            type: integer
            minimum: 1
            default: 16
          extra_args:
            type: string
            default: ""

  intervals:
    type: object
    additionalProperties: false
    default: {}
    properties:
      enabled:
        type: boolean
        default: true
      min_nmer:
        type: integer
        minimum: 1
        default: 500
      num_gvcf_intervals:
        type: integer
        minimum: 1
        default: 50
      db_scatter_factor:
        type: number
        minimum: 0
        default: 0.15
      min_contig_length:
        type: integer
        minimum: 0
        default: 0
      db_max_intervals_per_shard:
        type: integer
        minimum: 0
        default: 200
      db_max_contigs_per_shard:
        type: integer
        minimum: 0
        default: 200

  callable_sites:
    type: object
    additionalProperties: false
    default: {}
    properties:
      generate_bed_file:
        type: boolean
        default: true
      coverage:
        type: object
        additionalProperties: false
        default: {}
        properties:
          enabled:
            type: boolean
            default: true
          fraction:
            type: number
            minimum: 0
            maximum: 1
            default: 1.0
          min_coverage:
            anyOf:
              - type: number
                minimum: 0
              - type: string
                enum: ["auto"]
            default: "auto"
          max_coverage:
            anyOf:
              - type: number
                minimum: 0
              - type: string
                enum: ["auto"]
            default: "auto"
          merge_distance:
            type: integer
            minimum: 0
            default: 100
      mappability:
        type: object
        additionalProperties: false
        default: {}
        properties:
          enabled:
            type: boolean
            default: true
          kmer:
            type: integer
            minimum: 1
            default: 150
          min_score:
            type: number
            minimum: 0
            maximum: 1
            default: 1
          merge_distance:
            type: integer
            minimum: 0
            default: 100

  modules:
    type: object
    additionalProperties: false
    default: {}
    properties:
      qc:
        type: object
        additionalProperties: false
        default: {}
        properties:
          enabled:
            type: boolean
            default: false
          clusters:
            type: integer
            minimum: 1
            default: 3
          min_depth:
            type: number
            minimum: 0
            default: 2
          max_sample_missingness:
            type: number
            minimum: 0
            maximum: 1
            default: 0.49
          google_api_key:
            type: string
            default: ""
          exclude_scaffolds:
            type: string
            default: ""
      postprocess:
        type: object
        additionalProperties: false
        default: {}
        properties:
          enabled:
            type: boolean
            default: false
          filtering:
            type: object
            additionalProperties: false
            default: {}
            properties:
              contig_size:
                type: integer
                minimum: 0
                default: 10000
              maf:
                type: number
                minimum: 0
                maximum: 1
                default: 0.01
              missingness:
                type: number
                minimum: 0
                maximum: 1
                default: 0.75
              exclude_scaffolds:
                type: string
                default: "mtDNA,Y"
              split_by_type:
                type: boolean
                default: true
                description: >
                  Also emit clean_snps.vcf.gz and clean_indels.vcf.gz (the
                  strict-filtered VCF split by variant type).
              keep_basic_filter:
                type: boolean
                default: false
                description: >
                  Retain the intermediate basic-filter VCF
                  (results/postprocess/basic.vcf.gz) instead of treating it as a
                  temporary file consumed by the strict filter.

required:
  - samples
  - reference

# snpArcher v2 Configuration Example

samples: "config/samples.csv"

# Optional: per-sample metadata for modules (exclude, outgroup, lat, long, etc.)
# sample_metadata: "config/sample_metadata.csv"

reference:
  name: "my_organism"
  source: "/data/reference/genome.fna.gz"  # Can be a refseq/genbank accession, url, or path

mapping:
  # How reads become each sample's final BAM: default (fastp, bwa mem, sambamba
  # duplicate marking) | sentieon (Sentieon mapping and Dedup; used automatically
  # with variant_calling.tool: sentieon, the only caller it supports).
  pipeline: "default"

variant_calling:
  expected_coverage: "low"  # low | high | auto (future)
  tool: "gatk" # gatk | sentieon | bcftools | deepvariant | parabricks | repadapt
  # Produce results/vcfs/filtered.vcf.gz (raw + a FILTER column) as a default output:
  # GATK hard filters for GATK-family callers (gatk/sentieon/parabricks), or RepAdapt's
  # AllHomAlt/LowMQ soft filters for repadapt. It is ignored with a warning for
  # bcftools/deepvariant (which don't emit the required annotations). Set false to
  # skip filtering entirely; the raw VCF then becomes the final call set for
  # postprocess/qc and `call_variants`.
  generate_filtered_vcf: true
  ploidy: 2
  gatk:
    het_prior: 0.005
  sentieon:
    license: ""
  bcftools: # Not used by tool: repadapt, which uses RepAdapt's fixed mpileup settings.
    min_mapq: 20
    min_baseq: 20
    max_depth: 250
  deepvariant:
    model_type: "WGS"
    num_shards: 8
  parabricks:
    container_image: ""  # Required if tool == "parabricks"
    num_gpus: 1
    num_cpu_threads: 16
    extra_args: ""

intervals:
  enabled: true
  min_nmer: 500
  num_gvcf_intervals: 50
  db_scatter_factor: 0.15
  min_contig_length: 0
  db_max_intervals_per_shard: 200
  db_max_contigs_per_shard: 200


callable_sites:
  generate_bed_file: True
  coverage:
    enabled: true
    fraction: 1.0
    min_coverage: auto
    max_coverage: auto
    merge_distance: 100
  mappability:
    enabled: true
    min_score: 1
    kmer: 150
    merge_distance: 100

modules:
  qc:
    enabled: false
    clusters: 3
    min_depth: 2
    google_api_key: ""
    exclude_scaffolds: ""
  postprocess:
    enabled: false
    filtering:
      contig_size: 10000
      maf: 0.01
      missingness: 0.75
      exclude_scaffolds: "mtDNA,Y"
      split_by_type: true       # also emit clean_snps.vcf.gz / clean_indels.vcf.gz
      keep_basic_filter: false  # retain the pre-strict basic-filter VCF instead of discarding it

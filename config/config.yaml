# snpArcher v2 Configuration Example

samples: "config/samples.csv"

# Optional: per-sample metadata for modules (exclude, outgroup, lat, long, etc.)
# sample_metadata: "config/sample_metadata.csv"

reads:
  mark_duplicates: true
  sra:
    # fasterq-dump is the default extractor. For reference-aligned (cSRA)
    # submissions it builds a spot-id lookup over every alignment, which does
    # not scale: a run with 1.1e9 alignments against an 8.9 Gbp reference
    # projects to ~577 h, versus ~3.3 h for fastq-dump. The two produce
    # byte-identical FASTQ, so snpArcher falls back to fastq-dump when needed.
    #
    # Budget for fasterq-dump before falling back. A backstop, not a target:
    # a healthy 400M-spot aligned run finishes in well under an hour.
    fasterq_budget_minutes: 360
    # Skip fasterq-dump outright when BOTH thresholds are met. Both must hold,
    # because alignment count and reference size are confounded in the only
    # dataset where this has been measured. Set alignments to 0 to disable the
    # shortcut and let the budget decide every time.
    direct_fastq_dump_min_alignments: 300000000
    direct_fastq_dump_min_reference_bp: 3000000000

reference:
  name: "my_organism"
  source: "/data/reference/genome.fna.gz"  # Can be a refseq/genbank accession, url, or path

variant_calling:
  expected_coverage: "low"  # low | high | auto (future)
  tool: "gatk" # gatk | sentieon | bcftools | deepvariant | parabricks
  # Produce results/vcfs/filtered.vcf.gz (raw + GATK hard-filter FILTER column) as a
  # default output. Only applies to GATK-family callers (gatk/sentieon/parabricks);
  # it is ignored with a warning for bcftools/deepvariant (which don't emit the
  # required annotations). Set false for a raw-only default (the filtered VCF is
  # still built on demand by postprocess/qc or the `call_variants` target).
  generate_filtered_vcf: true
  ploidy: 2
  gatk:
    het_prior: 0.005
  sentieon:
    license: ""
  bcftools:
    min_mapq: 20
    min_baseq: 20
    max_depth: 250
  deepvariant:
    model_type: "WGS"
    num_shards: 8
  parabricks:
    container_image: ""  # Required if tool == "parabricks"
    num_gpus: 1
    num_cpu_threads: 16
    extra_args: ""

intervals:
  enabled: true
  min_nmer: 500
  num_gvcf_intervals: 50
  db_scatter_factor: 0.15
  min_contig_length: 0
  db_max_intervals_per_shard: 200
  db_max_contigs_per_shard: 200


callable_sites:
  generate_bed_file: True
  coverage:
    enabled: true
    fraction: 1.0
    min_coverage: auto
    max_coverage: auto
    merge_distance: 100
  mappability:
    enabled: true
    min_score: 1
    kmer: 150
    merge_distance: 100

modules:
  qc:
    enabled: false
    clusters: 3
    min_depth: 2
    google_api_key: ""
    exclude_scaffolds: ""
  postprocess:
    enabled: false
    filtering:
      contig_size: 10000
      maf: 0.01
      missingness: 0.75
      exclude_scaffolds: "mtDNA,Y"
      split_by_type: true       # also emit clean_snps.vcf.gz / clean_indels.vcf.gz
      keep_basic_filter: false  # retain the pre-strict basic-filter VCF instead of discarding it
